<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Tic-Tac-Toe — Ultimate Games</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--border:#2a2a3a;--red:#ff4455;--blue:#4488ff;--glow:#aa88ff;--text:#e8e8f0;--muted:#555570;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;transition:background-color 0.6s,background-image 0.6s;background-image:radial-gradient(ellipse at 20% 50%,rgba(255,68,85,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(68,136,255,0.06) 0%,transparent 50%);}
body.turn-r{background-color:#150407!important;background-image:radial-gradient(ellipse at 30% 40%,rgba(255,68,85,0.14) 0%,transparent 60%)!important;}
body.turn-b{background-color:#04060f!important;background-image:radial-gradient(ellipse at 70% 40%,rgba(68,136,255,0.14) 0%,transparent 60%)!important;}

.back{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);background:var(--surface);padding:10px 20px;border-radius:8px;transition:all 0.2s;align-self:flex-start;margin-bottom:20px;}
.back:hover{color:var(--text);border-color:var(--glow);}

header{text-align:center;margin-bottom:18px;}
header h1{font-size:clamp(1.4rem,4vw,2.5rem);font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--red),var(--glow),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
header p{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--muted);margin-top:4px;letter-spacing:2px;text-transform:uppercase;}

.ctrl{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
.btn{font-family:'JetBrains Mono',monospace;font-size:0.72rem;font-weight:700;letter-spacing:1px;padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
.btn:hover{border-color:var(--glow);color:var(--glow);}
.btn.active{border-color:var(--glow);background:rgba(170,136,255,0.15);color:var(--glow);}
.btn.danger:hover{border-color:var(--red);color:var(--red);}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.seg .btn{border:none;border-radius:0;border-right:1px solid var(--border);}
.seg .btn:last-child{border-right:none;}

.status-bar{font-family:'JetBrains Mono',monospace;font-size:0.85rem;margin-bottom:12px;min-height:32px;display:flex;align-items:center;gap:10px;justify-content:center;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 16px;border-radius:20px;font-weight:700;font-size:0.9rem;}
.pill.x{background:rgba(255,68,85,0.15);color:var(--red);border:1px solid rgba(255,68,85,0.3);}
.pill.o{background:rgba(68,136,255,0.15);color:var(--blue);border:1px solid rgba(68,136,255,0.3);}
.win-msg{font-size:1.1rem;font-weight:800;animation:pulse 0.9s ease-in-out infinite alternate;}
@keyframes pulse{from{opacity:0.8;transform:scale(1)}to{opacity:1;transform:scale(1.04)}}
.ai-txt{font-size:0.78rem;color:var(--blue);animation:blink 0.7s step-end infinite;}
@keyframes blink{50%{opacity:0}}

.big-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--border);padding:8px;border-radius:16px;border:1px solid var(--border);box-shadow:0 0 60px rgba(170,136,255,0.1);width:min(520px,94vw);height:min(520px,94vw);}
.small-board{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;border-radius:10px;background:var(--surface);border:2px solid transparent;transition:border-color 0.3s,background 0.3s,box-shadow 0.3s,opacity 0.3s;position:relative;overflow:hidden;}
.small-board.active-board{border-color:var(--glow);animation:boardpulse 2s ease-in-out infinite;}
@keyframes boardpulse{0%,100%{box-shadow:0 0 20px rgba(170,136,255,0.3)}50%{box-shadow:0 0 36px rgba(170,136,255,0.55)}}
.small-board.won-x{background:rgba(255,68,85,0.18);border-color:var(--red);}
.small-board.won-o{background:rgba(68,136,255,0.18);border-color:var(--blue);}
.small-board.drawn{background:rgba(100,100,120,0.08);}
.small-board.inactive{opacity:0.35;}
.big-symbol{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(2rem,8vw,4rem);font-weight:800;border-radius:8px;z-index:2;pointer-events:none;animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes popIn{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.big-symbol.x{color:var(--red);text-shadow:0 0 40px var(--red);}
.big-symbol.o{color:var(--blue);text-shadow:0 0 40px var(--blue);}
.big-symbol.draw{color:var(--muted);font-size:clamp(1rem,4vw,1.8rem);}
.cell{background:rgba(255,255,255,0.03);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(0.7rem,2vw,1.1rem);cursor:pointer;transition:background 0.15s,transform 0.12s;border:1px solid rgba(255,255,255,0.04);}
.cell:hover:not(.taken){background:rgba(170,136,255,0.15);transform:scale(1.08);}
.cell.taken{cursor:default;}
.cell.x{color:var(--red);}
.cell.o{color:var(--blue);}
.cell.just-played{animation:cellpop 0.3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes cellpop{from{transform:scale(0.4);opacity:0.4}to{transform:scale(1);opacity:1}}
.small-board.inactive .cell{cursor:not-allowed;}
.small-board.inactive .cell:hover{background:rgba(255,255,255,0.03);transform:none;}

.scoreboard{display:flex;gap:14px;margin-top:16px;font-family:'JetBrains Mono',monospace;}
.si{text-align:center;padding:10px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--border);min-width:72px;}
.si .lbl{font-size:0.58rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.si .val{font-size:1.4rem;font-weight:700;margin-top:2px;}
.si.x .val{color:var(--red);}
.si.o .val{color:var(--blue);}
.si.d .val{color:var(--muted);}
.si.bump .val{animation:bump 0.35s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes bump{from{transform:scale(1.6)}to{transform:scale(1)}}

.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.78);backdrop-filter:blur(6px);align-items:center;justify-content:center;}
.overlay.show{display:flex;animation:fi 0.3s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 44px;max-width:300px;width:90%;text-align:center;box-shadow:0 0 80px rgba(170,136,255,0.22);animation:su 0.4s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.ov-card .emoji{font-size:3rem;margin-bottom:8px;}
.ov-card h2{font-size:1.9rem;font-weight:800;margin-bottom:6px;}
.ov-card p{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:0.72rem;margin-bottom:22px;}
.ov-card .btn{padding:12px 32px;font-size:0.82rem;width:100%;}

#particles{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden;}
.particle{position:absolute;border-radius:50%;animation:fp var(--dur) ease-out forwards;}
@keyframes fp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(calc(-80px - var(--dist))) scale(0);opacity:0}}

@media(max-width:480px){.big-board{gap:6px;padding:6px;}.small-board{gap:2px;padding:4px;}.ctrl{gap:6px;}.btn{padding:7px 11px;font-size:0.65rem;}}
</style>
</head>
<body>
<div id="particles"></div>
<div class="overlay" id="overlay">
  <div class="ov-card">
    <div class="emoji" id="ovEmoji">🎉</div>
    <h2 id="ovTitle"></h2>
    <p id="ovSub"></p>
    <button class="btn active" onclick="closeOverlay()">Play Again</button>
  </div>
</div>

<a class="back" href="index.html">← Ultimate Games</a>

<header>
  <h1>ULTIMATE TIC-TAC-TOE</h1>
  <p>9 boards · 1 winner · infinite strategy</p>
</header>

<div class="ctrl">
  <div class="seg">
    <button class="btn active" id="btn2p" onclick="setMode('2p')">2 Player</button>
    <button class="btn" id="btnAI" onclick="setMode('ai')">vs AI</button>
  </div>
  <div class="seg" id="diffRow" style="opacity:0.3;pointer-events:none">
    <button class="btn active" id="dEasy" onclick="setDiff('easy')">Easy</button>
    <button class="btn" id="dMedium" onclick="setDiff('medium')">Med</button>
    <button class="btn" id="dHard" onclick="setDiff('hard')">Hard</button>
  </div>
  <button class="btn" id="btnForced" onclick="toggleForced()">Forced: ON</button>
  <button class="btn" id="btnSound" onclick="toggleSound()">🔊</button>
  <button class="btn danger" onclick="resetGame()">Reset</button>
</div>

<div class="status-bar" id="statusBar"></div>
<div class="big-board" id="bigBoard"></div>

<div class="scoreboard">
  <div class="si x" id="siX"><div class="lbl">X — Red</div><div class="val" id="scX">0</div></div>
  <div class="si d" id="siD"><div class="lbl">Draw</div><div class="val" id="scD">0</div></div>
  <div class="si o" id="siO"><div class="lbl">O — Blue</div><div class="val" id="scO">0</div></div>
</div>

<script>
const WIN_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let mode='2p',diff='easy',forced=true,soundOn=true;
let player='X',activeBoard=null,boards=[],bigWon=[],over=false,aiThinking=false;
let scores={X:0,O:0,D:0},lastPlayed=null;

const AC=new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('click',()=>{if(AC.state==='suspended')AC.resume();},{once:true});
function tone(f,t='sine',d=0.1,v=0.15,dl=0){try{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+dl);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dl+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+dl);o.stop(AC.currentTime+dl+d+0.02);}catch(e){}}
function sndPlace(p){if(!soundOn)return;p==='X'?tone(440,'triangle',0.09,0.18):tone(320,'sine',0.09,0.18);}
function sndWin(){if(!soundOn)return;[0,0.1,0.2,0.32].forEach((d,i)=>tone([523,659,784,1047][i],'triangle',0.22,0.28,d));}
function sndDraw(){if(!soundOn)return;tone(280,'sawtooth',0.18,0.14);tone(240,'sawtooth',0.18,0.14,0.15);}
function sndClick(){tone(600,'sine',0.05,0.08);}

function checkWin(cells){for(const[a,b,c]of WIN_LINES)if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c])return cells[a];if(cells.every(c=>c))return'D';return null;}

function initGame(){
  boards=Array.from({length:9},()=>Array(9).fill(null));
  bigWon=Array(9).fill(null);
  player='X';activeBoard=null;over=false;aiThinking=false;lastPlayed=null;
  document.getElementById('overlay').classList.remove('show');
  render();status();
}
function resetGame(){sndClick();initGame();}
function setMode(m){sndClick();mode=m;document.getElementById('btn2p').classList.toggle('active',m==='2p');document.getElementById('btnAI').classList.toggle('active',m==='ai');const dr=document.getElementById('diffRow');dr.style.opacity=m==='ai'?'1':'0.3';dr.style.pointerEvents=m==='ai'?'auto':'none';initGame();}
function setDiff(d){sndClick();diff=d;['easy','medium','hard'].forEach(x=>document.getElementById('d'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===d));}
function toggleForced(){sndClick();forced=!forced;document.getElementById('btnForced').textContent='Forced: '+(forced?'ON':'OFF');initGame();}
function toggleSound(){soundOn=!soundOn;document.getElementById('btnSound').textContent=soundOn?'🔊':'🔇';}

function render(){
  const el=document.getElementById('bigBoard');el.innerHTML='';
  for(let bi=0;bi<9;bi++){
    const sb=document.createElement('div');sb.className='small-board';
    const isActive=!over&&!aiThinking&&(activeBoard===null?!bigWon[bi]:activeBoard===bi);
    if(bigWon[bi]){sb.classList.add(bigWon[bi]==='X'?'won-x':bigWon[bi]==='O'?'won-o':'drawn');const sym=document.createElement('div');sym.className='big-symbol '+(bigWon[bi]==='D'?'draw':bigWon[bi].toLowerCase());sym.textContent=bigWon[bi]==='D'?'—':bigWon[bi];sb.appendChild(sym);}
    else if(isActive)sb.classList.add('active-board');
    else sb.classList.add('inactive');
    for(let ci=0;ci<9;ci++){const cell=document.createElement('div');const v=boards[bi][ci];cell.className='cell'+(v?' taken '+v.toLowerCase():'');if(lastPlayed&&lastPlayed.bi===bi&&lastPlayed.ci===ci)cell.classList.add('just-played');cell.textContent=v||'';if(isActive&&!v)cell.onclick=()=>handleMove(bi,ci);sb.appendChild(cell);}
    el.appendChild(sb);
  }
}
function status(){
  const bar=document.getElementById('statusBar');
  const winner=bigWon.find(v=>v==='X'||v==='O');
  if(over){if(winner){const col=winner==='X'?'var(--red)':'var(--blue)';bar.innerHTML=`<span class="win-msg" style="color:${col}">${winner} Wins! 🎉</span>`;}else bar.innerHTML=`<span class="win-msg" style="color:var(--muted)">Draw! 🤝</span>`;}
  else if(aiThinking)bar.innerHTML=`<span class="ai-txt">AI thinking...</span>`;
  else{const cls=player.toLowerCase();const label=mode==='ai'&&player==='O'?'AI (O)':player;bar.innerHTML=`<span>Turn:</span><span class="pill ${cls}">${label}</span>`;}
  document.body.classList.remove('turn-r','turn-b');
  if(!over)document.body.classList.add(player==='X'?'turn-r':'turn-b');
}
function handleMove(bi,ci){
  if(over||aiThinking)return;if(boards[bi][ci])return;if(forced&&activeBoard!==null&&activeBoard!==bi)return;if(bigWon[bi])return;
  applyMove(bi,ci);
  if(!over&&mode==='ai'&&player==='O'){aiThinking=true;render();status();setTimeout(doAI,diff==='easy'?380:diff==='medium'?550:750);}
}
function applyMove(bi,ci){
  boards[bi][ci]=player;lastPlayed={bi,ci};sndPlace(player);
  const sw=checkWin(boards[bi]);
  if(sw&&sw!=='D'){bigWon[bi]=sw;scores[sw]++;updateScores(sw);over=true;render();status();setTimeout(()=>{sndWin();spawnParticles();const t=document.getElementById('ovTitle');document.getElementById('ovEmoji').textContent=sw==='X'?'🏆':mode==='ai'?'🤖':'🏆';t.textContent=sw==='X'?'X Wins!':mode==='ai'?'AI Wins!':'O Wins!';t.style.color=sw==='X'?'var(--red)':'var(--blue)';document.getElementById('ovSub').textContent='Got 3 in a row!';document.getElementById('overlay').classList.add('show');},220);return;}
  if(sw==='D')bigWon[bi]='D';
  if(bigWon.every(v=>v!==null)){scores['D']++;updateScores('D');over=true;render();status();setTimeout(()=>{sndDraw();document.getElementById('ovEmoji').textContent='🤝';const t=document.getElementById('ovTitle');t.textContent="It's a Draw!";t.style.color='var(--muted)';document.getElementById('ovSub').textContent='No winner.';document.getElementById('overlay').classList.add('show');},220);return;}
  if(forced)activeBoard=bigWon[ci]?null:ci;
  player=player==='X'?'O':'X';render();status();
}
function updateScores(b){document.getElementById('scX').textContent=scores.X;document.getElementById('scO').textContent=scores.O;document.getElementById('scD').textContent=scores.D;const map={X:'siX',O:'siO',D:'siD'};if(map[b]){const el=document.getElementById(map[b]);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}}
function closeOverlay(){sndClick();initGame();}
function spawnParticles(){const c=document.getElementById('particles');const cols=['var(--red)','var(--blue)','var(--glow)','#fff'];for(let i=0;i<50;i++){const p=document.createElement('div');p.className='particle';const sz=5+Math.random()*10;p.style.cssText=`left:${Math.random()*100}vw;bottom:${10+Math.random()*50}vh;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};--dur:${0.7+Math.random()*0.9}s;--dist:${70+Math.random()*120}px;`;c.appendChild(p);setTimeout(()=>p.remove(),1100);}}
function doAI(){
  const moves=[];for(let bi=0;bi<9;bi++){if(bigWon[bi])continue;if(forced&&activeBoard!==null&&activeBoard!==bi)continue;for(let ci=0;ci<9;ci++)if(!boards[bi][ci])moves.push({bi,ci});}
  aiThinking=false;if(!moves.length){render();status();return;}
  const rand=()=>moves[Math.floor(Math.random()*moves.length)];
  const smart=()=>{for(const{bi,ci}of moves){const t=[...boards[bi]];t[ci]='O';if(checkWin(t)==='O')return{bi,ci};}for(const{bi,ci}of moves){const t=[...boards[bi]];t[ci]='X';if(checkWin(t)==='X')return{bi,ci};}if(diff==='hard'){for(const{bi,ci}of moves)if(ci===4)return{bi,ci};}return null;};
  let move;if(diff==='easy')move=Math.random()<0.22?smart()||rand():rand();else if(diff==='medium')move=Math.random()<0.62?smart()||rand():rand();else move=smart()||rand();
  applyMove(move.bi,move.ci);
}
setMode('2p');
</script>
</body>
</html>
