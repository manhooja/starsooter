<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Ultimate Games</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--border:#2a2a3a;--red:#ff4455;--blue:#4488ff;--glow:#aa88ff;--text:#e8e8f0;--muted:#555570;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;background-image:radial-gradient(ellipse at 20% 50%,rgba(68,136,255,0.07) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(255,68,85,0.05) 0%,transparent 50%);}

.back{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);background:var(--surface);padding:10px 20px;border-radius:8px;transition:all 0.2s;align-self:flex-start;margin-bottom:20px;}
.back:hover{color:var(--text);border-color:var(--glow);}

header{text-align:center;margin-bottom:18px;}
header h1{font-size:clamp(1.6rem,4vw,2.8rem);font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--blue),var(--glow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
header p{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--muted);margin-top:4px;letter-spacing:2px;text-transform:uppercase;}

.hud{display:flex;gap:16px;margin-bottom:14px;font-family:'JetBrains Mono',monospace;align-items:center;flex-wrap:wrap;justify-content:center;}
.score-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 20px;text-align:center;}
.score-box .lbl{font-size:0.58rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.score-box .val{font-size:1.5rem;font-weight:700;}
.score-box.blue-val .val{color:var(--blue);}
.score-box.glow-val .val{color:var(--glow);}

.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;}
.btn{font-family:'JetBrains Mono',monospace;font-size:0.72rem;font-weight:700;letter-spacing:1px;padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
.btn:hover{border-color:var(--glow);color:var(--glow);}
.btn.active{border-color:var(--blue);background:rgba(68,136,255,0.15);color:var(--blue);}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.seg .btn{border:none;border-radius:0;border-right:1px solid var(--border);}
.seg .btn:last-child{border-right:none;}

canvas{border-radius:14px;border:2px solid var(--border);display:block;box-shadow:0 0 40px rgba(68,136,255,0.1);background:#0a0a12;}
canvas.dead{border-color:var(--red);box-shadow:0 0 40px rgba(255,68,85,0.2);}

.msg{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--muted);margin-top:14px;letter-spacing:1px;text-align:center;min-height:22px;}

.dpad{display:none;margin-top:18px;flex-direction:column;align-items:center;gap:4px;}
.dpad.show{display:flex;}
.dpad-row{display:flex;gap:6px;}
.dpad-btn{width:54px;height:54px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1.2rem;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;}
.dpad-btn:active{background:rgba(68,136,255,0.2);border-color:var(--blue);}
</style>
</head>
<body>

<a class="back" href="index.html">← Ultimate Games</a>

<header>
  <h1>SNAKE</h1>
  <p>eat · grow · survive</p>
</header>

<div class="hud">
  <div class="score-box blue-val"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
  <div class="score-box glow-val"><div class="lbl">Best</div><div class="val" id="best">0</div></div>
</div>

<div class="ctrl">
  <div class="seg">
    <button class="btn active" id="spSlow" onclick="setSpeed('slow')">Slow</button>
    <button class="btn" id="spMed" onclick="setSpeed('med')">Med</button>
    <button class="btn" id="spFast" onclick="setSpeed('fast')">Fast</button>
  </div>
  <button class="btn" id="btnPause" onclick="togglePause()">Pause</button>
  <button class="btn" onclick="restart()">Restart</button>
</div>

<canvas id="c"></canvas>
<div class="msg" id="msg">Press arrow keys or tap D-pad to start</div>

<div class="dpad" id="dpad">
  <div class="dpad-row"><button class="dpad-btn" onclick="dpad('up')">▲</button></div>
  <div class="dpad-row">
    <button class="dpad-btn" onclick="dpad('left')">◀</button>
    <button class="dpad-btn" onclick="dpad('down')">▼</button>
    <button class="dpad-btn" onclick="dpad('right')">▶</button>
  </div>
</div>

<script>
const COLS=20,ROWS=20,SPEEDS={slow:180,med:110,fast:65};
let speed='slow',ctx,cs;
let snake,dir,nextDir,food,score,hi=0;
let running=false,paused=false,dead=false,loop;

const AC=new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('click',()=>{if(AC.state==='suspended')AC.resume();},{once:true});
function tone(f,t,d,v,dl=0){try{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+dl);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dl+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+dl);o.stop(AC.currentTime+dl+d+0.02);}catch(e){}}

function init(){
  const canvas=document.getElementById('c');
  const sz=Math.min(window.innerWidth-32,480);
  cs=Math.floor(sz/COLS);
  canvas.width=cs*COLS;canvas.height=cs*ROWS;
  ctx=canvas.getContext('2d');
  if('ontouchstart' in window)document.getElementById('dpad').classList.add('show');
  hi=+localStorage.getItem('snake_hi')||0;
  document.getElementById('best').textContent=hi;
  drawIdle();
}

function restart(){
  clearInterval(loop);
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;dead=false;paused=false;
  document.getElementById('score').textContent=0;
  document.getElementById('msg').textContent='';
  document.getElementById('btnPause').textContent='Pause';
  document.getElementById('c').classList.remove('dead');
  placeFood();running=true;
  loop=setInterval(tick,SPEEDS[speed]);
}

function placeFood(){
  let p;
  do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}

function tick(){
  if(paused)return;
  dir={...nextDir};
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){gameOver();return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;document.getElementById('score').textContent=score;
    if(score>hi){hi=score;localStorage.setItem('snake_hi',hi);document.getElementById('best').textContent=hi;}
    placeFood();tone(500,'triangle',0.08,0.15);
  }else snake.pop();
  draw();
}

function gameOver(){
  clearInterval(loop);running=false;dead=true;
  document.getElementById('c').classList.add('dead');
  document.getElementById('msg').innerHTML=`<span style="color:var(--red)">Game Over!</span> &nbsp;Score: ${score} &nbsp;— Press Restart`;
  tone(200,'sawtooth',0.3,0.2);
}

function draw(){
  ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  ctx.fillStyle='rgba(255,255,255,0.025)';
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){ctx.beginPath();ctx.arc(x*cs+cs/2,y*cs+cs/2,1,0,Math.PI*2);ctx.fill();}
  ctx.shadowColor='#ff4455';ctx.shadowBlur=14;ctx.fillStyle='#ff4455';
  ctx.beginPath();ctx.roundRect(food.x*cs+3,food.y*cs+3,cs-6,cs-6,4);ctx.fill();
  ctx.shadowBlur=0;
  snake.forEach((s,i)=>{
    const t=i/snake.length;
    ctx.shadowColor=i===0?'rgba(68,136,255,0.6)':'transparent';ctx.shadowBlur=i===0?10:0;
    ctx.fillStyle=`rgb(${Math.round(68+(255-68)*t)},${Math.round(136+(68-136)*t)},${Math.round(255+(85-255)*t)})`;
    const p=i===0?1:2;ctx.beginPath();ctx.roundRect(s.x*cs+p,s.y*cs+p,cs-p*2,cs-p*2,i===0?5:3);ctx.fill();
  });
  ctx.shadowBlur=0;
}

function drawIdle(){
  ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  ctx.fillStyle='rgba(68,136,255,0.05)';
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){ctx.beginPath();ctx.arc(x*cs+cs/2,y*cs+cs/2,1,0,Math.PI*2);ctx.fill();}
}

function setSpeed(s){
  speed=s;
  ['Slow','Med','Fast'].forEach(x=>document.getElementById('sp'+x).classList.toggle('active',x.toLowerCase()===s));
  if(running&&!dead){clearInterval(loop);loop=setInterval(tick,SPEEDS[s]);}
}

function togglePause(){
  if(!running||dead)return;
  paused=!paused;
  document.getElementById('btnPause').textContent=paused?'Resume':'Pause';
  document.getElementById('msg').textContent=paused?'Paused':'';
}

function dpad(d){
  if(!running||dead){restart();return;}
  const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  const nd=map[d];if(nd.x+dir.x!==0||nd.y+dir.y!==0)nextDir=nd;
}

document.addEventListener('keydown',e=>{
  const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  if(map[e.key]){e.preventDefault();if(!running||dead){restart();return;}const nd=map[e.key];if(nd.x+dir.x!==0||nd.y+dir.y!==0)nextDir=nd;}
  if(e.key===' '){e.preventDefault();togglePause();}
});

window.addEventListener('load',init);
window.addEventListener('resize',()=>{if(!running)init();});
</script>
</body>
</html>
