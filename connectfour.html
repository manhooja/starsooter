<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four — Ultimate Games</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--border:#2a2a3a;--red:#ff4455;--blue:#4488ff;--glow:#aa88ff;--text:#e8e8f0;--muted:#555570;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;transition:background-color 0.6s,background-image 0.6s;background-image:radial-gradient(ellipse at 20% 50%,rgba(255,68,85,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(68,136,255,0.06) 0%,transparent 50%);}
body.turn-r{background-color:#150407!important;background-image:radial-gradient(ellipse at 30% 40%,rgba(255,68,85,0.13) 0%,transparent 60%)!important;}
body.turn-b{background-color:#04060f!important;background-image:radial-gradient(ellipse at 70% 40%,rgba(68,136,255,0.13) 0%,transparent 60%)!important;}

.back{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:0.82rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);background:var(--surface);padding:10px 20px;border-radius:8px;transition:all 0.2s;align-self:flex-start;margin-bottom:20px;}
.back:hover{color:var(--text);border-color:var(--glow);}

header{text-align:center;margin-bottom:16px;}
header h1{font-size:clamp(1.6rem,4vw,2.8rem);font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--red),var(--glow),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
header p{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--muted);margin-top:4px;letter-spacing:2px;text-transform:uppercase;}

.ctrl{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;align-items:center;}
.btn{font-family:'JetBrains Mono',monospace;font-size:0.72rem;font-weight:700;letter-spacing:1px;padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
.btn:hover{border-color:var(--glow);color:var(--glow);}
.btn.active{border-color:var(--glow);background:rgba(170,136,255,0.15);color:var(--glow);}
.btn.danger:hover{border-color:var(--red);color:var(--red);}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.seg .btn{border:none;border-radius:0;border-right:1px solid var(--border);}
.seg .btn:last-child{border-right:none;}

.status-bar{font-family:'JetBrains Mono',monospace;font-size:0.85rem;margin-bottom:12px;min-height:32px;display:flex;align-items:center;gap:10px;justify-content:center;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 16px;border-radius:20px;font-weight:700;font-size:0.9rem;}
.pill.r{background:rgba(255,68,85,0.15);color:var(--red);border:1px solid rgba(255,68,85,0.3);}
.pill.b{background:rgba(68,136,255,0.15);color:var(--blue);border:1px solid rgba(68,136,255,0.3);}
.win-msg{font-size:1.1rem;font-weight:800;animation:pulse 0.9s ease-in-out infinite alternate;}
@keyframes pulse{from{opacity:0.8;transform:scale(1)}to{opacity:1;transform:scale(1.04)}}
.ai-txt{font-size:0.78rem;color:var(--blue);animation:blink 0.7s step-end infinite;}
@keyframes blink{50%{opacity:0}}

.cf-wrap{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:10px;box-shadow:0 0 50px rgba(170,136,255,0.08);width:min(460px,96vw);}
.col-hints{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;padding:0 1px;}
.col-hint{height:14px;border-radius:4px;transition:background 0.15s;cursor:pointer;}
.col-hint.rh:hover{background:rgba(255,68,85,0.45);}
.col-hint.bh:hover{background:rgba(68,136,255,0.45);}
.cf-board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:5px;aspect-ratio:7/6;}
.cf-cell{border-radius:50%;background:#090910;border:1px solid rgba(255,255,255,0.04);transition:all 0.18s;cursor:pointer;}
.cf-cell:hover.empty.clickable{background:rgba(170,136,255,0.08);}
.cf-cell.r{background:var(--red);box-shadow:0 0 10px rgba(255,68,85,0.4);border-color:rgba(255,68,85,0.3);animation:dropin 0.22s cubic-bezier(0.34,1.4,0.64,1);}
.cf-cell.b{background:var(--blue);box-shadow:0 0 10px rgba(68,136,255,0.4);border-color:rgba(68,136,255,0.3);animation:dropin 0.22s cubic-bezier(0.34,1.4,0.64,1);}
.cf-cell.win-cell{animation:winpulse 0.7s ease-in-out infinite alternate;}
@keyframes dropin{from{transform:scale(0.2);opacity:0.2}to{transform:scale(1);opacity:1}}
@keyframes winpulse{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.14);filter:brightness(1.6)}}

.scoreboard{display:flex;gap:14px;margin-top:16px;font-family:'JetBrains Mono',monospace;}
.si{text-align:center;padding:10px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--border);min-width:72px;}
.si .lbl{font-size:0.58rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.si .val{font-size:1.4rem;font-weight:700;margin-top:2px;}
.si.r .val{color:var(--red);}
.si.b .val{color:var(--blue);}
.si.d .val{color:var(--muted);}
.si.bump .val{animation:bump 0.35s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes bump{from{transform:scale(1.6)}to{transform:scale(1)}}

.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.78);backdrop-filter:blur(6px);align-items:center;justify-content:center;}
.overlay.show{display:flex;animation:fi 0.3s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 44px;max-width:300px;width:90%;text-align:center;box-shadow:0 0 80px rgba(170,136,255,0.22);animation:su 0.4s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.ov-card .emoji{font-size:3rem;margin-bottom:8px;}
.ov-card h2{font-size:1.9rem;font-weight:800;margin-bottom:6px;}
.ov-card p{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:0.72rem;margin-bottom:22px;}
.ov-card .btn{padding:12px 32px;font-size:0.82rem;width:100%;}

#particles{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden;}
.particle{position:absolute;border-radius:50%;animation:fp var(--dur) ease-out forwards;}
@keyframes fp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(calc(-80px - var(--dist))) scale(0);opacity:0}}
</style>
</head>
<body>
<div id="particles"></div>
<div class="overlay" id="overlay">
  <div class="ov-card">
    <div class="emoji" id="ovEmoji">🎉</div>
    <h2 id="ovTitle"></h2>
    <p id="ovSub"></p>
    <button class="btn active" onclick="closeOverlay()">Play Again</button>
  </div>
</div>

<a class="back" href="index.html">← Ultimate Games</a>

<header>
  <h1>CONNECT FOUR</h1>
  <p>drop · connect · win</p>
</header>

<div class="ctrl">
  <div class="seg">
    <button class="btn active" id="btn2p" onclick="setMode('2p')">2 Player</button>
    <button class="btn" id="btnAI" onclick="setMode('ai')">vs AI</button>
  </div>
  <div class="seg" id="diffRow" style="opacity:0.3;pointer-events:none">
    <button class="btn active" id="dEasy" onclick="setDiff('easy')">Easy</button>
    <button class="btn" id="dMedium" onclick="setDiff('medium')">Med</button>
    <button class="btn" id="dHard" onclick="setDiff('hard')">Hard</button>
  </div>
  <button class="btn danger" onclick="resetGame()">Reset</button>
</div>

<div class="status-bar" id="statusBar"></div>

<div class="cf-wrap">
  <div class="col-hints" id="cfHints"></div>
  <div class="cf-board" id="cfBoard"></div>
</div>

<div class="scoreboard">
  <div class="si r" id="siR"><div class="lbl">Red</div><div class="val" id="scR">0</div></div>
  <div class="si d" id="siD"><div class="lbl">Draw</div><div class="val" id="scD">0</div></div>
  <div class="si b" id="siB"><div class="lbl">Blue</div><div class="val" id="scB">0</div></div>
</div>

<script>
const ROWS=6,COLS=7;
let mode='2p',diff='easy',grid,current,over,thinking;
let scores={r:0,b:0,d:0};

const AC=new(window.AudioContext||window.webkitAudioContext)();
document.addEventListener('click',()=>{if(AC.state==='suspended')AC.resume();},{once:true});
function tone(f,t,d,v,dl=0){try{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+dl);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dl+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+dl);o.stop(AC.currentTime+dl+d+0.02);}catch(e){}}
function sndDrop(p){p==='r'?tone(300,'triangle',0.08,0.18):tone(220,'sine',0.08,0.18);}
function sndWin(){[0,0.1,0.2,0.32].forEach((d,i)=>tone([440,554,659,880][i],'triangle',0.22,0.28,d));}
function sndDraw(){tone(260,'sawtooth',0.18,0.14);tone(220,'sawtooth',0.18,0.14,0.15);}
function sndClick(){tone(600,'sine',0.05,0.08);}

function checkWin(p){const dirs=[[0,1],[1,0],[1,1],[1,-1]];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c]!==p)continue;for(const[dr,dc]of dirs){let n=1;for(let i=1;i<4;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=ROWS||nc<0||nc>=COLS||grid[nr][nc]!==p)break;n++;}if(n===4)return true;}}return false;}
function winCells(){const s=new Set();const dirs=[[0,1],[1,0],[1,1],[1,-1]];['r','b'].forEach(p=>{for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c]!==p)continue;for(const[dr,dc]of dirs){const cs=[];for(let i=0;i<4;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=ROWS||nc<0||nc>=COLS||grid[nr][nc]!==p)break;cs.push(nr*COLS+nc);}if(cs.length===4)cs.forEach(k=>s.add(k));}}});return s;}
function getRow(col){for(let r=ROWS-1;r>=0;r--)if(!grid[r][col])return r;return -1;}

function initGame(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));current='r';over=false;thinking=false;render();status();bg();}
function resetGame(){sndClick();initGame();}
function setMode(m){sndClick();mode=m;document.getElementById('btn2p').classList.toggle('active',m==='2p');document.getElementById('btnAI').classList.toggle('active',m==='ai');const dr=document.getElementById('diffRow');dr.style.opacity=m==='ai'?'1':'0.3';dr.style.pointerEvents=m==='ai'?'auto':'none';initGame();}
function setDiff(d){sndClick();diff=d;['easy','medium','hard'].forEach(x=>document.getElementById('d'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===d));}
function bg(){document.body.classList.remove('turn-r','turn-b');if(!over)document.body.classList.add(current==='r'?'turn-r':'turn-b');}

function render(){
  const board=document.getElementById('cfBoard'),hints=document.getElementById('cfHints');
  board.innerHTML='';hints.innerHTML='';
  const wins=over?winCells():new Set();
  for(let c=0;c<COLS;c++){const h=document.createElement('div');h.className='col-hint '+(current==='r'?'rh':'bh');if(!over&&!thinking)h.onclick=()=>drop(c);hints.appendChild(h);}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cell=document.createElement('div');const v=grid[r][c];cell.className='cf-cell '+(v||'empty');if(!over&&!thinking&&!v)cell.classList.add('clickable');if(wins.has(r*COLS+c))cell.classList.add('win-cell');if(!over&&!thinking&&!v)cell.onclick=()=>drop(c);board.appendChild(cell);}
}
function status(){
  const bar=document.getElementById('statusBar');
  if(over)return;
  if(thinking){bar.innerHTML=`<span class="ai-txt">AI thinking...</span>`;return;}
  const label=mode==='ai'&&current==='b'?'AI (Blue)':current==='r'?'Red':'Blue';
  bar.innerHTML=`<span>Turn:</span><span class="pill ${current}">${label}</span>`;
}

function drop(col){
  if(over||thinking)return;
  const row=getRow(col);if(row===-1)return;
  place(col,row);
  if(!over&&mode==='ai'&&current==='b'){thinking=true;render();status();setTimeout(doAI,diff==='easy'?350:diff==='medium'?520:720);}
}
function place(col,row){
  grid[row][col]=current;sndDrop(current);
  if(checkWin(current)){
    scores[current]++;updateScores(current);over=true;render();
    setTimeout(()=>{sndWin();spawnParticles();const isR=current==='r';const t=document.getElementById('ovTitle');document.getElementById('ovEmoji').textContent='🏆';t.textContent=isR?'Red Wins!':mode==='ai'?'AI Wins!':'Blue Wins!';t.style.color=isR?'var(--red)':'var(--blue)';document.getElementById('ovSub').textContent=isR?'Red got 4 in a row!':mode==='ai'?'The AI was too strong.':'Blue got 4 in a row!';document.getElementById('overlay').classList.add('show');},200);return;
  }
  if(grid[0].every(c=>c)){scores.d++;updateScores('d');over=true;render();setTimeout(()=>{sndDraw();const t=document.getElementById('ovTitle');document.getElementById('ovEmoji').textContent='🤝';t.textContent="It's a Draw!";t.style.color='var(--muted)';document.getElementById('ovSub').textContent='Board filled up.';document.getElementById('overlay').classList.add('show');},200);return;}
  current=current==='r'?'b':'r';render();status();bg();
}
function updateScores(b){document.getElementById('scR').textContent=scores.r;document.getElementById('scB').textContent=scores.b;document.getElementById('scD').textContent=scores.d;const map={r:'siR',b:'siB',d:'siD'};if(map[b]){const el=document.getElementById(map[b]);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}}
function closeOverlay(){sndClick();initGame();}
function spawnParticles(){const c=document.getElementById('particles');const cols=['var(--red)','var(--blue)','var(--glow)','#fff'];for(let i=0;i<50;i++){const p=document.createElement('div');p.className='particle';const sz=5+Math.random()*10;p.style.cssText=`left:${Math.random()*100}vw;bottom:${10+Math.random()*50}vh;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};--dur:${0.7+Math.random()*0.9}s;--dist:${70+Math.random()*120}px;`;c.appendChild(p);setTimeout(()=>p.remove(),1100);}}

function doAI(){
  const avail=[...Array(COLS).keys()].filter(c=>getRow(c)!==-1);
  thinking=false;if(!avail.length){render();status();return;}
  const rand=()=>avail[Math.floor(Math.random()*avail.length)];
  const smart=()=>{for(const c of avail){const r=getRow(c);grid[r][c]='b';const w=checkWin('b');grid[r][c]=null;if(w)return c;}for(const c of avail){const r=getRow(c);grid[r][c]='r';const w=checkWin('r');grid[r][c]=null;if(w)return c;}if(diff==='hard'){const p=[3,2,4,1,5,0,6];for(const c of p)if(avail.includes(c))return c;}return null;};
  let col;if(diff==='easy')col=Math.random()<0.25?smart()??rand():rand();else if(diff==='medium')col=Math.random()<0.65?smart()??rand():rand();else col=smart()??rand();
  const row=getRow(col);place(col,row);
}

setMode('2p');
</script>
</body>
</html>
